<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirror fit test</title>
<style>
  :root{
    --bg:#ece8f1; --ink:#1c1726; --muted:#625a70; --panel:#ffffff;
    --btn:#2a2140; --btn-ink:#ffffff; --fit:#ff3d8b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#120f18; --ink:#efe9f7; --muted:#a69cb6; --panel:#1e1928;
      --btn:#ff3d8b; --btn-ink:#120f18; color-scheme: dark; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font: 16px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:12px}
  canvas{width:100%; height:100%; object-fit:contain; border-radius:18px; background:#000}
  video{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
  .intro{text-align:center; max-width:30ch; color:var(--muted)}
  .intro h1{font-size:1.6rem; line-height:1.15; color:var(--ink); margin:0 0 .5rem; letter-spacing:-.01em}
  .panel{background:var(--panel); margin:0 12px 12px; border-radius:18px; padding:14px 16px}
  #status{margin:0 0 12px; min-height:1.45em}
  #status.ok{color:var(--fit); font-weight:600}
  .row{display:flex; gap:10px}
  button{
    flex:1; font:inherit; font-weight:600; border:0; border-radius:12px;
    padding:13px 12px; background:var(--btn); color:var(--btn-ink);
  }
  button.ghost{background:transparent; color:var(--ink); outline:2px solid var(--muted); outline-offset:-2px}
  button:disabled{opacity:.45}
  button:focus-visible{outline:3px solid var(--fit); outline-offset:2px}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="intro" id="intro">
      <h1>Mirror fit test</h1>
      <p>Stand in front of a mirror and point your back camera at your reflection. If a pink panel sticks to your chest, the idea works.</p>
    </div>
    <canvas id="view" hidden></canvas>
  </div>
  <video id="cam" playsinline muted></video>
  <div class="panel">
    <p id="status">Tap start, then allow the camera.</p>
    <div class="row">
      <button id="start">Start camera</button>
      <button id="flip" class="ghost" disabled>Switch camera</button>
    </div>
  </div>

<script type="module">
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const flipBtn = document.getElementById('flip');
const video = document.getElementById('cam');
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const intro = document.getElementById('intro');

let landmarker = null, stream = null, running = false;
let facing = 'environment';
let lastTs = -1, frames = 0, fps = 0, fpsClock = performance.now();
let filters = [];

// Adaptive smoothing: steady when you hold still, fast when things move
class LowPass { constructor(){ this.y = null; } run(x, a){ this.y = this.y === null ? x : a * x + (1 - a) * this.y; return this.y; } }
class OneEuro {
  constructor(minCutoff = 1.5, beta = 0.012, dCutoff = 1){
    this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
    this.x = new LowPass(); this.dx = new LowPass(); this.tPrev = null; this.xPrev = 0;
  }
  alpha(cutoff, dt){ const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  run(x, t){
    if (this.tPrev === null){ this.tPrev = t; this.xPrev = x; this.dx.run(0, 1); return this.x.run(x, 1); }
    const dt = Math.max(0.001, (t - this.tPrev) / 1000);
    this.tPrev = t;
    const speed = this.dx.run((x - this.xPrev) / dt, this.alpha(this.dCutoff, dt));
    this.xPrev = x;
    return this.x.run(x, this.alpha(this.minCutoff + this.beta * Math.abs(speed), dt));
  }
}

function say(text, ok=false){ statusEl.textContent = text; statusEl.className = ok ? 'ok' : ''; }

if (!window.isSecureContext) {
  say('This page needs an https link to use the camera. Open it from your GitHub Pages address.');
  startBtn.disabled = true;
}

async function loadModel(){
  say('Loading body tracking… (first time takes a few seconds)');
  const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const { PoseLandmarker, FilesetResolver } = vision;
  const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts = (delegate) => ({
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
      delegate
    },
    runningMode: 'VIDEO', numPoses: 1
  });
  try { return await PoseLandmarker.createFromOptions(files, opts('GPU')); }
  catch (e) { return await PoseLandmarker.createFromOptions(files, opts('CPU')); }
}

async function openCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
  filters = [];
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  try {
    await openCamera();
    if (!landmarker) landmarker = await loadModel();
    intro.hidden = true; canvas.hidden = false;
    flipBtn.disabled = false;
    startBtn.textContent = 'Running';
    running = true;
    say('Point the camera at your reflection.');
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    startBtn.disabled = false;
    if (e && e.name === 'NotAllowedError') {
      say('Camera blocked. Go to Settings › Safari › Camera, choose Allow, then reload this page.');
    } else {
      say('Couldn’t start: ' + (e && e.message ? e.message : e) + '. Reload and try again.');
    }
  }
});

flipBtn.addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await openCamera(); } catch (e) { say('Couldn’t switch camera: ' + e.message); }
});

const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const JOINTS = [0,11,12,13,14,15,16,23,24,25,26,27,28];
const seen = (p) => p && (p.visibility === undefined || p.visibility > 0.5);

function torsoQuad(lm, w, h){
  const ls = lm[11], rs = lm[12], lh = lm[23], rh = lm[24];
  if (!seen(ls) || !seen(rs)) return null;
  const P = (p) => ({ x: p.x * w, y: p.y * h });
  const a = P(ls), b = P(rs);
  let c, d;
  if (seen(lh) && seen(rh)) { c = P(rh); d = P(lh); }
  else {
    // hips out of view: estimate them from shoulder width
    const sw = Math.hypot(a.x - b.x, a.y - b.y);
    const dx = -(a.y - b.y) / sw, dy = (a.x - b.x) / sw;
    const dir = dy < 0 ? -1 : 1; // always point downward
    const L = sw * 1.35;
    c = { x: b.x + dx * L * dir, y: b.y + dy * L * dir };
    d = { x: a.x + dx * L * dir, y: a.y + dy * L * dir };
  }
  const pts = [a, b, c, d];
  const cx = pts.reduce((s,p)=>s+p.x,0)/4, cy = pts.reduce((s,p)=>s+p.y,0)/4;
  return pts.map(p => ({ x: cx + (p.x - cx) * 1.15, y: cy + (p.y - cy) * 1.08 }));
}

function draw(res, w, h){
  const raw = res && res.landmarks && res.landmarks[0];
  if (!raw) { filters = []; say('No body found. Step back so your upper body fits in the mirror.'); return; }

  const t = performance.now();
  const lm = raw.map((p, i) => {
    if (!filters[i]) filters[i] = { x: new OneEuro(), y: new OneEuro() };
    return { x: filters[i].x.run(p.x * w, t) / w, y: filters[i].y.run(p.y * h, t) / h, visibility: p.visibility };
  });

  const quad = torsoQuad(lm, w, h);
  if (quad) {
    ctx.beginPath();
    quad.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,61,139,0.55)'; ctx.fill();
    ctx.lineWidth = Math.max(3, w / 220); ctx.strokeStyle = '#ff3d8b'; ctx.stroke();
  }

  ctx.lineWidth = Math.max(2, w / 300);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  for (const [i, j] of BONES) {
    if (!seen(lm[i]) || !seen(lm[j])) continue;
    ctx.beginPath(); ctx.moveTo(lm[i].x * w, lm[i].y * h); ctx.lineTo(lm[j].x * w, lm[j].y * h); ctx.stroke();
  }
  const r = Math.max(4, w / 160);
  ctx.fillStyle = '#ffffff';
  for (const k of JOINTS) {
    if (!seen(lm[k])) continue;
    ctx.beginPath(); ctx.arc(lm[k].x * w, lm[k].y * h, r, 0, Math.PI * 2); ctx.fill();
  }
  say(`Body tracked · ${fps} fps`, true);
}

function loop(){
  if (!running) return;
  if (video.readyState >= 2 && video.videoWidth) {
    const w = video.videoWidth, h = video.videoHeight;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    ctx.drawImage(video, 0, 0, w, h);
    const now = performance.now();
    if (now > lastTs) {
      lastTs = now;
      let res = null;
      try { res = landmarker.detectForVideo(video, now); } catch (e) { console.error(e); }
      draw(res, w, h);
      frames++;
      if (now - fpsClock >= 1000) { fps = frames; frames = 0; fpsClock = now; }
    }
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
